kargs = [
  "quiet",
  "threadirqs",
  "slab_nomerge",
  "sysrq_always_enabled=1",
  "bluetooth.disable_ertm=0",
  "loglevel=3",
  "page_alloc.shuffle=1",
  "preempt=full",
  "psi=1",
  "transparent_hugepage=madvise",
  "transparent_hugepage_shmem=advise",
  "scsi_mod.use_blk_mq=1",
  "lru_gen=y",
  "lru_gen_min_ttl_ms=1000",
  "systemd.zram=0",
  "zswap.enabled=1",
  "zswap.exclusive_loads=Y",
  "zswap.shrinker_enabled=Y",
  "zswap.zpool=zsmalloc",
  "zswap.compressor=zstd",
  "zswap.max_pool_percent=30",
  "zswap.accept_threshold_percent=90",
  "zswap.same_filled_pages_enabled=1",
  "zswap.non_same_filled_pages_enabled=1",
  "clocksource=tsc",
  "pcie_aspm=on",
  "amd_pstate=active",
  "amd_pstate.enable=1",
  "amd_pstate.shared_mem=1",
  "amdgpu.sg_display=1",
  "amdgpu.gpu_recovery=1",
  "intel_pstate=active",
  "intel_pstate.enable=1",
  "i915.enable_psr=2",
  "pci=realloc=on",
  "mitigations=auto",
  "rootflags=noatime,nodiratime,compress-force=zstd:1,discard=async,space_cache=v2,commit=120"
]

# --------------------------------------------------------------------------------
# Argument descriptions:
# --------------------------------------------------------------------------------

# quiet                      # 🤫 Simpler, focused debugging on errors than general noisy stats
# threadirqs                 # 🧵 Moves hardware interrupt handlers into threads, allowing the scheduler to granularly manage tasks.
# sysrq_always_enabled=1     # 🔑 Provides a low-level interface to rescue a frozen system (e.g., REISUB), regardless of UI state.
# consoleblank=300           # 🖥️ Prevents TTY from display burn in and efficiency
# bluetooth.disable_ertm=0   # 📶 Enhanced Retransmission Mode for modern BT peripherals.
# loglevel=3                 # 📉 Limits logging to 'Error' level; prevents the 'dmesg' buffer from being flooded by minor warnings.
# preempt=full               # ⚡ Allows the kernel to be interrupted any time, better responsivenss and faster changing to workloads
# zswap.enabled=1            # 🗜️ Intercepts pages moving to swap and compresses them in RAM to reduce physical Disk I/O.
# zswap.shrinker_enabled=Y   # ♻️ Automatically evicts the coldest compressed pages to disk when RAM is needed elsewhere.
# zswap.zpool=zsmalloc       # 🏗️ Uses a highly efficient memory allocator that reduces fragmentation in compressed memory pools.
# zswap.compressor=zstd      # 🚀 Offers a great balance between speed and compression; ideal for modern high-frequency 
# clocksource=tsc            # ⏱️ Forces the 'Time Stamp Counter'; the lowest latency method for the OS to track time on x86. HPET is a legacy method
# pcie_aspm=on               # 🍃 Enables Active State Power Management; allows PCIe links to enter low-power states when idle.
# amd_pstate=active          # 💎 Requests the hardware to manage its own clock speeds based on internal circuitry and stress.
# amd_pstate.enable=1        # ✅ Activates the modern AMD P-State driver for finer-grained power/performance control on Zen CPUs.
# amd_pstate.shared_mem=1    # 🧠 Allows the CPU and OS to communicate via shared memory for faster frequency transitions.
# intel_pstate=active        # 🏎️ Uses Intel's hardware-managed P-states (HWP) for superior efficiency compared to legacy ACPI.
# amdgpu.sg_display=1        # 📽️ Enables Scatter/Gather display; allows the GPU to use non-contiguous memory for frame buffers.
# pci=realloc=on             # 🗺️ Allows the kernel to re-map PCI resources if the BIOS didn't allocate enough space (BAR).

# Remove:
# systemd.zram=1             # 🛑 Never use with zswap
# nomodeset                  # 🚫 Allows the kernel to use high-performance GPU drivers (KMS) instead of slow VESA fallbacks.
# profile                    # 🚫 Stops the kernel from collecting profiling data, saving CPU cycles.

# --------------------------------------------------------------------------------
# Explanations:
# --------------------------------------------------------------------------------

# Kernel preemption:____________________________________________________________________
# For customizeability from the user end, PREEMPT_DYNAMIC is needed to be added as an argument during kernel compilation
# However that name is very misleading IMO, PREEMPT_DYNAMIC is simply a "wrapper" or boot-time switch that lets you choose between existing models
# So, PREEMPT_CUSTOM would be more suitable

# PREEMPT_LAZY is a new experimental implementation which is intended
# to be the new default for all general systems, as it does preemption more intelligently
# as compared to voluntary. Preempts immediately for RT tasks, delays for normal tasks

# zRAM/ZSwap:

# https://linuxblog.io/zswap-better-than-zram/
# https://www.youtube.com/watch?v=RGVt16xiERc&t=394 # Reference at the timestamp within the link

# zswap ( Best )
# Reduced drive wear compared to traditional swap
# Prevents OOMs as compared to zram, when you hit max compressible limit
# zswap handles memory more intelligently than zram
# dynamic smart cache for a disk-based swap device, nuanced decisions about memory management
# Disk swap is slower, but its advantages outweight this w/ zswap
# More efficient - handles incompressible data as required
# Lower CPU overhead - more responsive
# Needs a swap partition/file. A dedicated partition is more direct, reduces sector access overhead, effect is negigible on NVMes
# Recommended: All large storage devices attached to your PC should have 4GB or larger swap device

# Never use ZSWAP with ZRAM - it adds unnecessary, uncoordinated overhead between the two
# Keep an on-disk swap partition. I dont care about the priority of it but it needs to be there
# Prevents RAM starvation. This fallback efficiently keeps your unsaved work safe from potential crashes
# It doesnt save unsaved work, just prevents system OOMs(though the system doesnt panic here) that may lead to loss of work
# Likewise, enable Memory Extension on supported phones, prefer the largest or automatic sizing

# zram ( Avoid )
# Theoretically lowest latency
# Adds CPU strain, high temps even at idle especially if a memory hogging browser is running in the background
# Blind compression of data - the process becomes less efficient and consumes a significant number of CPU cycles
# as the compression algorithm attempts to find non-existent patterns
# Usually only better for systems with low memory
# Needs a good enough CPU for handling its strain fast
# No hassle of manually making swap devices - systemds zram generator does it all deriving it from the configuration

# You should really avoid increasing zswap.max_pool_percent above 50 or even 40, the safe 'enough' limit is 65(like for Redis)
# Like if you are gaming, and the game finds that it can fit a lot of contents(well, progressively as it sees 
# memory getting 'freed' up) into RAM and heavily preload stuff, that
# is an issue where the CPU keeps compressing and decompressing(when accessing the compressed contents) contents more than processing the actual game
# higher heat produced, thermal throttling and thus slowdowns
# At this point, getting the data from your disk is genuinely more efficient to process in this case.
# the latency of decompressing a massive, complex page from a large Zswap pool can actually be higher than just fetching it from the NVMe.
# More RAM, but at what cost? You need to find a balance(30 is good for most PCs), else this(a large value will be much more worse the zRAM.
# Swap will be slower but be more efficient to process in this context

# 1. ZSTD - Best balance for all computing, speed and compression ratio
# For modern consumer devices+gaming
# Fits memory constrained systems as well
# 2. LZ4 - good speed, bad compression ratio
# Avoids CPU usage, but zRAM benefits are reduced
# Reduces intermediary hangups and internal lag spikes
# 3. LZO is simply less efficient and old
# 4. Brotli is unsuitable for this, as memory content is dynamic


