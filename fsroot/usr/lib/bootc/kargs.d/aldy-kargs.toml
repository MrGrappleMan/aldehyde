kargs = [
  "splash",
  "quiet",
  "threadirqs",
  "sysrq_always_enabled=1",
  "consoleblank=300",
  "bluetooth.disable_ertm=0",
  "loglevel=3",
  "preempt=full",
  "psi=1",
  "transparent_hugepage=madvise",
  "scsi_mod.use_blk_mq=1",
  "systemd.zram=0",
  "zswap.enabled=1",
  "zswap.shrinker_enabled=Y",
  "zswap.zpool=zsmalloc",
  "zswap.compressor=zstd",
  "zswap.max_pool_percent=30",
  "zswap.accept_threshold_percent=90",
  "clocksource=tsc",
  "pcie_aspm=on",
  "amd_pstate=active",
  "amd_pstate.enable=1",
  "amd_pstate.shared_mem=1",
  "amdgpu.sg_display=1",
  "intel_pstate=active",
  "intel_pstate.enable=1",
  "pci=realloc=on",
  "rootflags=noatime,nodiratime,compress-force=zstd:1,discard=async,space_cache=v2,commit=120"
]

# Kernel Arguments

# quiet                      # 🤫 Simpler, focused debugging on errors than general noisy stats
# threadirqs                 # 🧵 Moves hardware interrupt handlers into threads, allowing the scheduler to granularly manage tasks.
# sysrq_always_enabled=1     # 🔑 Provides a low-level interface to rescue a frozen system (e.g., REISUB), regardless of UI state.
# consoleblank=300           # 🖥️ Prevents TTY from display burn in and efficiency
# bluetooth.disable_ertm=0   # 📶 Enhanced Retransmission Mode for modern BT peripherals.
# loglevel=3                 # 📉 Limits logging to 'Error' level; prevents the 'dmesg' buffer from being flooded by minor warnings.
# preempt=full               # ⚡ Allows the kernel to be interrupted any time, better responsivenss and faster changing to workloads
# zswap.enabled=1            # 🗜️ Intercepts pages moving to swap and compresses them in RAM to reduce physical Disk I/O.
# zswap.shrinker_enabled=Y   # ♻️ Automatically evicts the coldest compressed pages to disk when RAM is needed elsewhere.
# zswap.zpool=zsmalloc       # 🏗️ Uses a highly efficient memory allocator that reduces fragmentation in compressed memory pools.
# zswap.compressor=zstd      # 🚀 Offers a great balance between speed and compression; ideal for modern high-frequency 
# clocksource=tsc            # ⏱️ Forces the 'Time Stamp Counter'; the lowest latency method for the OS to track time on x86. HPET is a legacy method
# pcie_aspm=on               # 🍃 Enables Active State Power Management; allows PCIe links to enter low-power states when idle.
# amd_pstate=active          # 💎 Requests the hardware to manage its own clock speeds based on internal circuitry and stress.
# amd_pstate.enable=1        # ✅ Activates the modern AMD P-State driver for finer-grained power/performance control on Zen CPUs.
# amd_pstate.shared_mem=1    # 🧠 Allows the CPU and OS to communicate via shared memory for faster frequency transitions.
# intel_pstate=active        # 🏎️ Uses Intel's hardware-managed P-states (HWP) for superior efficiency compared to legacy ACPI.
# amdgpu.sg_display=1        # 📽️ Enables Scatter/Gather display; allows the GPU to use non-contiguous memory for frame buffers.
# pci=realloc=on             # 🗺️ Allows the kernel to re-map PCI resources if the BIOS didn't allocate enough space (BAR).

# Remove:
# systemd.zram=1             # 🛑 Never use with zswap
# nomodeset                  # 🚫 Allows the kernel to use high-performance GPU drivers (KMS) instead of slow VESA fallbacks.
# profile                    # 🚫 Stops the kernel from collecting profiling data, saving CPU cycles.

# ZSwap/ZRAM Compression Algorithms:
# 1. ZSTD - Best balance for all computing. okay speed, better compression ratio
# For modern consumer devices+gaming
# Also for memory constrained systems
# 2. LZ4 - good speed, bad compression ratio
# Avoids CPU usage
# Reduces intermediary hangups and internal lag spikes
# 3. LZO is simply less efficient and old
# 4. Brotli is unsuitable for this, as memory content is dynamic.
