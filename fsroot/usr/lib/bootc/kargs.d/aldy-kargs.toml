kargs = [
  "quiet",
  "threadirqs",
  "sysrq_always_enabled=1",
  "consoleblank=180",
  "bluetooth.disable_ertm=0",
  "loglevel=3",
  "preempt=full",
  "psi=1",
  "systemd.zram=0",
  "zswap.enabled=1",
  "zswap.shrinker_enabled=Y",
  "zswap.zpool=zsmalloc",
  "zswap.compressor=zstd",
  "zswap.max_pool_percent=100",
  "zswap.accept_threshold_percent=100",
  "nowatchdog",
  "clocksource=tsc",
  "pcie_aspm=on",
  "amd_pstate=active",
  "amd_pstate.enable=1",
  "amd_pstate.shared_mem=1",
  "intel_pstate=active",
  "intel_pstate.enable=1",
  "amdgpu.sg_display=1",
  "pci=realloc=on",
  "rootflags=noatime,nodiratime,compress-force=zstd:1,discard=async,space_cache=v2,commit=120" # Better storage performance
]

# Kernel Arguments

# quiet                      # 🤫 Simpler, focused debugging on errors than general stats
# threadirqs                 # 🧵 Moves hardware interrupt handlers into threads, allowing the scheduler to prioritize tasks.
# sysrq_always_enabled=1     # 🔑 Provides a low-level interface to rescue a frozen system (e.g., REISUB), regardless of UI state.
# consoleblank=180           # 🖥️ Prevents TTY from display burn in and efficiency
# bluetooth.disable_ertm=0   # 📶 Enhanced Retransmission Mode for modern BT peripherals.
# loglevel=3                 # 📉 Limits logging to 'Error' level; prevents the 'dmesg' buffer from being flooded by minor warnings.
# preempt=full               # ⚡ Allows the kernel to be interrupted more aggressively; improves desktop and audio responsiveness.
# zswap.enabled=1            # 🗜️ Intercepts pages moving to swap and compresses them in RAM to reduce physical Disk I/O.
# zswap.shrinker_enabled=Y   # ♻️ Automatically evicts the coldest compressed pages to disk when RAM is needed elsewhere.
# zswap.zpool=zsmalloc       # 🏗️ Uses a highly efficient memory allocator that reduces fragmentation in compressed memory pools.
# zswap.compressor=lz4       # 🚀 Prioritizes decompression speed over compression ratio; ideal for modern high-frequency CPUs.
# nowatchdog                 # 🐕 Disables the 'hang' detector; frees up a hardware timer and prevents NMI-related latency spikes.
# clocksource=tsc            # ⏱️ Forces the 'Time Stamp Counter'; the lowest latency method for the OS to track time on x86.
# pcie_aspm=on               # 🍃 Enables Active State Power Management; allows PCIe links to enter low-power states when idle.
# amd_pstate=guided          # 💎 Requests the hardware to manage its own clock speeds based on workload, rather than OS-fixed steps.
# amd_pstate.enable=1        # ✅ Activates the modern AMD P-State driver for finer-grained power/performance control on Zen CPUs.
# amd_pstate.shared_mem=1    # 🧠 Allows the CPU and OS to communicate via shared memory for faster frequency transitions.
# intel_pstate=active        # 🏎️ Uses Intel's hardware-managed P-states (HWP) for superior efficiency compared to legacy ACPI.
# amdgpu.sg_display=1        # 📽️ Enables Scatter/Gather display; allows the GPU to use non-contiguous memory for frame buffers.
# pci=realloc=on             # 🗺️ Allows the kernel to re-map PCI resources if the BIOS didn't allocate enough space (BAR).

# Should be disabled:
# rhgb                       # 🏙 Less boot overhead and less conflicts with drivers, at the cost of UX beauty
# systemd.zram=0             # 🛑 Never use with zswap
# (n) nomodeset              # 🚫 Allows the kernel to use high-performance GPU drivers (KMS) instead of slow VESA fallbacks.
# (n) profile                # 🚫 Stops the kernel from collecting profiling data, saving CPU cycles.
# intel_pstate=guided does not exist

# Zswap suitable compression algorithms:
# zstd good enough speed but great for balanced usage and greater occupiable memory
# lz4 overall lowest latency sacrificing compression ratio
# lz4 > lzo in terms of efficiency and modernity
# brotli is unsuitable for this, as memory content is dynamic.
