# ======================================================================================================================================================
# 🎬 Virtual Memory, tweaked as unused RAM is wasted RAM, utilize it and keep everything in it utilizing all of it. Compress/swap only when needed
# ======================================================================================================================================================

# Triggers, value changes triggers actions, and this is not an editable option type
#vm.compact_memory = 1
#vm.drop_caches = 1

vm.compact_unevictable_allowed = 1

# This causes background work can consume CPU resources and may cause temporary latency spikes
vm.compaction_proactiveness = 1
# 0<x<6 is good. Do not use 0. 1 allows, yet dramatically reduces it

vm.enable_soft_online = 1
vm.extfrag_threshold = 100 # Focus on reclaiming than compacting
vm.max_map_count = 2147483647 # Required for large processes
vm.highmem_is_dirtyable = 1

# No stats - less overhead during normal operation
# Enable when debugging
vm.mem_profiling = 0
vm.numa_stat = 0

# Out of Memory and recovery
vm.oom_kill_allocating_task = 1 # Kill the offending task immediately instead of random processes
vm.oom_dump_tasks = 0
vm.memory_failure_recovery = 1 # Recover memory on failure
vm.panic_on_oom = 0

vm.nr_hugepages = 0
vm.nr_trim_pages = 1
vm.hugetlb_optimize_vmemmap = 1
vm.overcommit_memory = 1 # Allows large allocations without rejection
vm.page-cluster = 0 # minimizes latency, which is more critical for a RAM-based swap device than sequential throughput.
vm.stat_interval = 2000000 # Less stats overhead

# Maintain data in RAM for performance.
# Despite there being the fast compressed RAM pool in zswap, this does NOT control that.
# Pool is controlled automatically
vm.swappiness = 1

# Power-saving feature — disable on desktop for lower I/O latency - TLP enables this if on a laptop, it runs after basic.target
vm.laptop_mode = 0

vm.vfs_cache_pressure = 5 # Retain filesystem/dentry cache longer → faster IO and lower overhead
vm.zone_reclaim_mode = 0 # Disable — can cause stalls under memory pressure on NUMA systems; modern kernels handle reclaim better globally
vm.watermark_boost_factor = 0 # Free up memory ONLY when it is required
vm.watermark_scale_factor = 10 # Keep the free buffer as small as possible (0.1% of RAM)
vm.dirty_ratio = 65                # Allow up to 65% of RAM to be "dirty" (pending writes)
vm.dirty_background_ratio = 30     # Dont even start background flushing until 30% is dirty
vm.dirty_expire_centisecs = 7500  # Data can sit in RAM for 120 seconds before being "old"
vm.dirty_writeback_centisecs = 500 # Wake up every 5s to check, but dirty_ratio governs the action
vm.min_free_kbytes = 65536

# https://linuxblog.io/zswap-better-than-zram/
# https://www.youtube.com/watch?v=RGVt16xiERc&t=394 # Reference at the timestamp within the link

# zswap ( Best ) :
# Reduced drive wear compared to traditional swap
# Prevents OOMs as compared to zram, when you hit max compressible limit
# zswap is generally considered to be handled more intelligently than zram
# dynamic smart cache for a disk-based swap device, making more nuanced decisions about memory management
# Disk is indeed somewhat slower(not much for modern NVME SSDs), but its advantages outweight this
# More efficient - handles incompressible data as required
# Lower CPU overhead is better for gaming
# Best overall for modern systems
# Requires making a swap partition which is prefered, more direct, reduces sector access overhead, even on NVMes though negligible advantage
# imo, every large storage device attached to your PC should have atleast 16GB of a swap partition - also consider the RAM shortages
# or a swap file which is flexible and easily discardable
# Requires you to edit kernel arguments "zswap.enabled = 1", already added to bootc kargs

# Do not use ZSWAP with ZRAM - it adds unnecessary, uncoordinated overhead between the two
# Keep an on-disk swap partition. I dont care about the priority of it but it needs to be there
# Prevents RAM starvation. This fallback efficiently keeps your unsaved work safe from potential crashes
# This does not back up your unsaved work, just prevents system OOMs that may lead to loss of work
# Likewise, enable Memory Extension on supported phones, prefer the largest or automatic sizing

# zram ( Avoid ) :
# Theoretically lowest latency
# Adds CPU strain, high temps even at idle especially if a memory hogging browser is running in the background
# Blind compression of data - the process becomes less efficient and consumes a significant number of CPU cycles as the compression algorithm attempts to find non-existent patterns
# Usually only better for systems with low memory
# Needs a good enough CPU for handling its strain fast
# No hassle of manually making swap devices - systemds zram generator does it all deriving it from the configuration

# The following are non functionable, they are just for reference. Ports to kernel args have been made.
#zswap.same_filled_pages_enabled = 1
#zswap.non_same_filled_pages_enabled = 1
#zswap.max_pool_percent = 35 ## 100% is unnecessary and harmful ZSWAP should be small to prevent runaway compression layers.
