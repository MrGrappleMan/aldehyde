# (A) means the subsequent options below the comment have their values calculated at startup based on,
# system parameters via some formula or condition, or the value is auto-adjusted during runtime.
# Values pre-defined by the kernel developers do not get marked with this.
# Documentation providing the specific information whether something is like this is yet to be explored
# The written options in it are for reference, having no effect.

# '### Doubt ###' means that it is currently being understood

# Sources considered in the creation:
# https://n1kobg.blogspot.com/p/blog-page_23.html?m=1

# ===============================================================================================================
# Filesystem
# ===============================================================================================================
fs.file-max = 9223372036854775806 # Allows more files to stay open
fs.aio-max-nr = 2147483647
fs.inotify.max_user_instances = 2147483647
fs.inotify.max_user_watches = 2147483647

# ================================================================================================================
# ⚙️ Kernel
# ================================================================================================================
kernel.oops_limit = 0
kernel.panic_on_oops = 0
kernel.panic_on_stackoverflow = 0

# Lower value allows(not induces a forced request) the kernel to do task load distribution over multiple cores more effectively
# The action of it is done automatically
# Greater parallelization, unpredictable workloads(like gaming) needs and lowering latency
# A tradeoff is task bouncing, causing CPU cache context misses, bad for deterministic HPC
kernel.sched_migration_cost_ns = 100000 # 0.1 ms

# Permits auto-grouping of interactive tasks for improved efficiency
# https://forum.proxmox.com/threads/increase-performance-with-sched_autogroup_enabled-0.41729/ # http://www.youtube.com/watch?v=prxInRdaNfc
kernel.sched_autogroup_enabled = 1
# 1 for overall desktop efficiency, responsiveness and interactive tasks
# 0 for HPC, determinism

# Allow emergency REISUB
kernel.sysrq = 1

# A measure that reduces the permittivity of an offending application to run effectively but keeps the rest of the system responsive
# Can be negative in rare cases
kernel.split_lock_mitigate = 1
# 1 to enable the protection method
# 0 to disable it

# No stats - less overhead during normal operation
# Enable when debugging
kernel.nmi_watchdog = 0
kernel.soft_watchdog = 0
kernel.watchdog = 0
kernel.sched_schedstats = 0
kernel.task_delayacct = 0

kernel.pid_max = 4194304 # Large number of allocatable processes

kernel.sched_latency_ns = 5000000

