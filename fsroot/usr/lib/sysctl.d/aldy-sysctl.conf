# 'A', Automatic means that the kernel handles this by itself at startup calculation or adjustment during runtime and there is practically no need to adjust the parameter
# What values does the kernel automatically calculate on boot/adjusts dynamically and does NOT use pre-defined values?
# They should be decided by the kernel based on system parameters, NOT be pre-defined constants declared by the developers. I could not find reliable documentation providing the specific information.
# Lines marked as 'A' are commented out to let the kernel decide. The written options in it are for some fallback, having no effect.

# Values for the "default" on a scale will be edited rarely. Only limits for min and max will be usually modified.

# Sources considered in the creation:
# https://n1kobg.blogspot.com/p/blog-page_23.html?m=1

# ===============================================================================================================
# Filesystem
# ===============================================================================================================
fs.file-max = 9223372036854775806 # Allows more files to stay open
fs.aio-max-nr = 2147483647
fs.inotify.max_user_instances=2147483647
fs.inotify.max_user_watches=2147483647

# ================================================================================================================
# ⚙️ Kernel
# ================================================================================================================
kernel.oops_limit = 0
kernel.panic_on_oops = 0
kernel.panic_on_stackoverflow = 0

# Lower value allows the kernel to do task load distribution over multiple cores, specifically idle ones with more granularity
# The action of is done automatically
# Greater parallelization, unpredictable workloads(like gaming) needs and lowering latency
# A tradeoff is task bouncing, causing CPU cache context misses, bad for deterministic HPC
kernel.sched_migration_cost_ns = 100000

# Permits auto-grouping of interactive tasks
# Improve fairness of tasks, hurts performance for HPC and gaming
# https://forum.proxmox.com/threads/increase-performance-with-sched_autogroup_enabled-0.41729/ # http://www.youtube.com/watch?v=prxInRdaNfc
kernel.sched_autogroup_enabled = 1
# 1 for overall desktop efficiency, responsiveness and interactive tasks
# 0 for HPC

# Allow emergency REISUB
kernel.sysrq = 1

# A measure that reduces the permittivity of an offending application to run effectively but keeps the rest of the system responsive
# Can be negative in certain cases
kernel.split_lock_mitigate=0

# No stats - less overhead during normal operation
# Enable when debugging
kernel.nmi_watchdog=0
kernel.soft_watchdog=0
kernel.watchdog=0
kernel.sched_schedstats = 0

kernel.pid_max = 4194304 # Large number of allocatable processes

# ================================================================================================================
# 🌐 Networking
# ================================================================================================================
net.core.bpf_jit_enable = 1 # converts BPF bytecode into native machine code for faster execution. Set to 2 for logs
net.core.bpf_jit_harden = 0 # Hardening costs performance → disable on trusted desktop
net.core.dev_weight = 1024 # A higher dev_weight can allow the kernel to process more packets in a single pass, potentially reducing CPU overhead and improving throughput for high-bandwidth applications. But 65536 can starve userspace, cause GUI stuttering

# Keep these always equal to never let one starve the other
net.core.dev_weight_tx_bias = 1
net.core.dev_weight_rx_bias = 1

net.core.netdev_budget = 2048
net.core.skb_defer_max = 256
net.core.netdev_max_backlog = 2147483647
net.core.optmem_max = 2147483647
#net.core.rmem_default = 262144 # A
net.core.rmem_max = 2147483647
net.core.somaxconn = 2147483647
#net.core.wmem_default = 262144 # A
net.core.wmem_max = 2147483647
net.ipv4.autoconf = 1 # AutoConfig IPv4 interfaces
net.ipv4.addr_gen_mode = 0
net.ipv4.tcp_shrink_window = 1
net.ipv4.tcp_window_scaling = 1 # allow TCP window size to exceed the original 65,535-byte limit
net.ipv4.tcp_max_syn_backlog = 2147483647
net.ipv4.tcp_syncookies = 1 # Protects against attacks
net.ipv4.tcp_tw_reuse = 1 # Allow fast socket reuse
net.ipv4.accept_ra = 2
net.ipv4.tcp_congestion_control = bbr
# Bazzite doesnt support bbr2 yet
net.core.default_qdisc = fq_codel

# Intentionally delays data transimssion to fill the packet fully
net.ipv4.tcp_autocorking = 1
# 1 for efficient data throughput, reduced packet processing overhead
# 0 for latency sensitive cases or gaming

# Dynamically change source IP adr of packets and sockets during retransmissions
net.ipv4.ip_dynaddr = 1

# Allow clients to send data in the initial SYN packet to reduce latency
net.ipv4.tcp_fastopen = 3

# Lower latency prioritized over maximum throughput
net.ipv4.tcp_low_latency = 1
# 1 for latency sensitive cases or gaming, some optimizations are disabled
# 0 for normal packet transmittion with optimizations and efficiency

# MTU Probing checks
net.ipv4.tcp_mtu_probing = 1
# 1 probes for MTU conditionally if PMTUD Black holes are detected
# 2 adds too much probing overhead for every connection, only for extremely unreliable coneections

# Dynamically picks an ideal receive buffer between your min and max based on measured BDP (bandwidth-delay product) and application read rate
net.ipv4.tcp_moderate_rcvbuf = 1

#net.ipv4.tcp_max_tw_buckets = 2000000 # A
# Automatic prevents OOM errors and excess starvation
# A single idle TCP socket can still grow huge if some buggy app or peer triggers the auto-tuning logic
# Setting minimums to 1 makes the system less stable under memory pressure, not more. I thought it was more efficent at first
# It prevents the TCP stack from giving memory back when the system really needs it, so you get zombie connections, GUI freezes, or full OOM killer storms instead of graceful degradation.

