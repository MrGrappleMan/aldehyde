### Doubt ###
# A higher dev_weight can allow the kernel to process more packets in a single pass
# potentially reducing CPU overhead and improving throughput for high-bandwidth applications
# 65536 can starve userspace, cause GUI stuttering
#net.core.dev_weight = 1024
#net.core.netdev_budget = 2048
#net.core.skb_defer_max = 128
#net.core.netdev_max_backlog = 2048 # 2147483647
#net.ipv4.tcp_max_syn_backlog = 2147483647
# Automatic prevents OOM errors and excess starvation
# A single idle TCP socket can still grow huge if some buggy app or peer triggers the auto-tuning logic
# Setting minimums to 1 makes the system less stable under memory pressure, not more. I thought it was more efficent at first
# It prevents the TCP stack from giving memory back when the system really needs it, so you get zombie connections, GUI freezes, or full OOM killer storms instead of graceful degradation.
#net.ipv4.tcp_max_tw_buckets = 2000000 # A

# Explicit Congestion Notification, helps avoid packet loss on modern routers.
net.ipv4.tcp_ecn = 1

# Convert BPF bytecode to native code for faster execution
net.core.bpf_jit_enable = 1
# 1 for normal, 2 for debug

net.core.bpf_jit_harden = 0 # Hardening costs performance, disable on trusted device
net.ipv4.addr_gen_mode = 0
net.ipv4.tcp_shrink_window = 1
net.ipv4.tcp_window_scaling = 1 # allow TCP window size to exceed the original 65,535-byte limit
net.ipv4.tcp_syncookies = 1 # Protects against attacks
net.ipv4.tcp_tw_reuse = 1 # Allow fast socket reuse
net.ipv4.accept_ra = 2

# Always keep equal to never let one starve the other
net.core.dev_weight_tx_bias = 1
net.core.dev_weight_rx_bias = 1

# Ideally, connection count should have no limit.
# The limit should be auto limited if stability/packet loss issues occur
net.core.somaxconn = 8192 # 2147483647 is max

# AutoConfig IPv4 interfaces
net.ipv4.autoconf = 1

# No support for BBR2 yet
net.ipv4.tcp_congestion_control = bbr

# BBR is designed with FQ in mind and best paired with it
# BBR pacing is more accurate with 'fq' than 'fq_codel'
net.core.default_qdisc = fq

# Dynamically delays writes based on current state of transmit queue for efficiency
net.ipv4.tcp_autocorking = 1
# 1 for efficient data throughput, reduces CPU overhead
# 0 for highly latency sensitive cases, but the advantages of enabling it are far better

# Auto change source IP address of packets and sockets during retransmissions
net.ipv4.ip_dynaddr = 1

# Allow clients to send data in the initial SYN packet
# Reduce TCP initialization latency
net.ipv4.tcp_fastopen = 3

# Lower latency prioritized over maximum throughput, this option is old, still kept and has some effect
net.ipv4.tcp_low_latency = 1
# 1 = latency sensitive cases or gaming, some optimizations are disabled
# 0 = normal packet transmittion with optimizations and efficiency

# MTU Probing checks
net.ipv4.tcp_mtu_probing = 1
# 1 = probes for MTU conditionally if PMTUD Black holes are detected
# 2 = adds too much probing overhead for every connection, only for extremely unreliable coneections

# Optimized processing
net.ipv4.udp_early_demux = 1

# Dynamically picks an ideal receive buffer between your min and max based on measured BDP (bandwidth-delay product) and application read rate
net.ipv4.tcp_moderate_rcvbuf = 1

