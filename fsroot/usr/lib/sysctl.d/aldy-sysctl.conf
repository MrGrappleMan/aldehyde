# ======================================================================================================================================================
# 🎬 Virtual Memory, tweaked as unused RAM is wasted RAM, utilize it and keep everything in it utilizing all of it. Compress/swap only when needed
# ======================================================================================================================================================

# Triggers, value changes triggers actions, and this is not an editable option type
#vm.compact_memory = 1
#vm.drop_caches = 1

vm.compact_unevictable_allowed = 1

# High value causes background work can consume CPU resources and may cause temporary latency spikes
vm.compaction_proactiveness = 5

vm.enable_soft_online = 1
vm.extfrag_threshold = 100 # Reduce memory compaction impacts
vm.max_map_count = 2147483647 # Required for large processes
vm.highmem_is_dirtyable = 1

# No stats - less overhead during normal operation
# Enable when debugging
vm.mem_profiling = 0
vm.numa_stat = 0

# Out of Memory, Recovery
vm.oom_kill_allocating_task = 1 # Kill the offending task immediately instead of random processes
vm.oom_dump_tasks = 1 # Helps diagnose OOM issues by logging PID, UID, VmSize, RSS, and oom_score_adj
vm.memory_failure_recovery = 1 # Recover memory on failure
vm.panic_on_oom = 0 # Never let make OOM the entire kernel panic and halt

vm.nr_hugepages = 0
vm.nr_trim_pages = 1
vm.hugetlb_optimize_vmemmap = 1

# Overcommiting of memory
vm.overcommit_memory = 0
# 1 allows large allocations blindly so lower overhead, but more OOM risk
# 0 large allocations done as per suitability of request determined by heuristics
# 2 no large allocations

vm.page-cluster = 0 # minimizes latency, which is good for ZSwap hot cache
vm.stat_interval = 10 # Less stats overhead

# Memory swapping ( behaviour is very different with ZSwap active )
# In practice, swap is a backup resort if memory is over-used and prevents OOM errors
# Low values = kernel avoids swapping/compressing data until OOM, thus massive stall when the 
# kernel finally panics to find memory, so ZSwap in this case is useless
# High values allow action to be done preemptively + ZSwap is more effective and efficiently works, but ONLY on zswap
# as high values on traditional swap cause high disk usage and slowdowns
vm.swappiness = 100

# Laptop Mode — disable for lower I/O latency, ensure data integrity
# This feature is risky on desktops for reasons like sudden power cuts, plug being accidentally removed
# It reschedules IO operation to be done in batches after longer timespans
# Is auto managed by TuneD
vm.laptop_mode = 0

vm.vfs_cache_pressure = 70 # Retain filesystem/dentry cache longer → faster IO and lower overhead
vm.zone_reclaim_mode = 0 # Can stalls under memory pressure on NUMA systems, modern kernel handles reclaim better globally
vm.watermark_boost_factor = 0 # Free up memory only when required
vm.watermark_scale_factor = 125 # Keep the free buffer (1.25% of RAM)
vm.dirty_ratio = 20 # Allow up to 20% of RAM to contain dirty data (pending writes to disk)
vm.dirty_background_ratio = 5 # Start background flushing as soon as it is detected
vm.dirty_expire_centisecs = 3000 # Data sits in RAM for 30 secs before being considered "old"
vm.dirty_writeback_centisecs = 500 # Wake up every 5s to check, but dirty_ratio governs the action
vm.min_free_kbytes = 65536

# https://linuxblog.io/zswap-better-than-zram/
# https://www.youtube.com/watch?v=RGVt16xiERc&t=394 # Reference at the timestamp within the link

# zswap ( Best ) :
# Reduced drive wear compared to traditional swap
# Prevents OOMs as compared to zram, when you hit max compressible limit
# zswap is generally considered to be handled more intelligently than zram
# dynamic smart cache for a disk-based swap device, making more nuanced decisions about memory management
# Disk is indeed somewhat slower(not much for modern NVME SSDs), but its advantages outweight this
# More efficient - handles incompressible data as required
# Lower CPU overhead is better for gaming
# Best overall for modern systems
# Needs a swap partition/file. A dedicated partition is more direct, reduces sector access overhead, effect is negigible on NVMes
# Recommended: All large storage devices attached to your PC should have 4GB or larger swap device

# Never use ZSWAP with ZRAM - it adds unnecessary, uncoordinated overhead between the two
# Keep an on-disk swap partition. I dont care about the priority of it but it needs to be there
# Prevents RAM starvation. This fallback efficiently keeps your unsaved work safe from potential crashes
# It doesnt save unsaved work, just prevents system OOMs(though the system doesnt panic here) that may lead to loss of work
# Likewise, enable Memory Extension on supported phones, prefer the largest or automatic sizing

# zram ( Avoid ) :
# Theoretically lowest latency
# Adds CPU strain, high temps even at idle especially if a memory hogging browser is running in the background
# Blind compression of data - the process becomes less efficient and consumes a significant number of CPU cycles as the compression algorithm attempts to find non-existent patterns
# Usually only better for systems with low memory
# Needs a good enough CPU for handling its strain fast
# No hassle of manually making swap devices - systemds zram generator does it all deriving it from the configuration
