[device]
wifi.backend=iwd
wifi.iwd.autoconnect=yes

[main]
iwd-config-path=auto

[connection.22-wifi-mac-addr]
match-device=type:wifi
wifi.cloned-mac-address=permanent

[connection]
metered=no

[.config]
enable=nm-version-min:1.45

[device-nbft-no-ignore-carrier]

# only affects nbft0, nbft1, ... interfaces
match-device=interface-name:nbft*

# react on link up/down events
ignore-carrier=no

# Verifies if your internet connection still works
[connectivity]
enabled=true
uri=http://fedoraproject.org/static/hotspot.txt
response=OK
interval=300
