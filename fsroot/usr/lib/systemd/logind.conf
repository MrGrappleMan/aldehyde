[Login]
  
# --- Core philosophy ---
# Avoid sleeping at all, keep all things alive while keeping them at a low power state.
# Hibernate ONLY when battery is critically low to prevent disk wear
# Behaves dependent on user interaction

# Lid behavior
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Button behaviour - user ideally should not override device power policy but we will allow it based on the request
HandlePowerKey=reboot
HandleRebootKey=reboot
HandleSuspendKey=reboot

# --- Battery safety net ---
# Hibernate ONLY on critical battery
HandleBatteryLow=ignore
HandleBatteryCritical=hibernate

# --- Session hygiene --- This conflicts with what you set in GNOME, so idle is dependent on what you set in userspace
KillUserProcesses=no
IdleAction=ignore
IdleActionSec=0
