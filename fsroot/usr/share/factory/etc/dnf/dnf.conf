[main]

# No one will be interacting during the build process
assumeno=0
assumeyes=1
defaultyes=1

# Flexibility in favour of having something that actually works rather than forced latest
best=0
allow_downgrade=1
allow_vendor_change=1

cacheonly=0
check_config_file_age=1
countme=1
color="auto"
debug_solver=0
debuglevel=0
diskspacecheck=1
enablegroups=1
exit_on_lock=0

# Spends some time probing mirrors when the runner's networking may be high-bandwidth
# But we'll keep it
fastestmirror=1

ignorearch=0

# Weak dependencies ensure full packages are installed + better potential feature set
# But too much bloat might be packaged in, disable
install_weak_deps=0

# Online man pages are also present and are infact, easier to navigate.
# A local LLM might as well help you, this might be more deterministic at actual instructions.
# Just use Kiwix in that case.
tsflags=nodocs

# Prevent bloating the bootc image
keepcache=0
build_cache=0
clean_requirements_on_remove=1
exclude_from_weak_autodetect=1

log_compress=1
log_rotate=6
logfilelevel=0

# gpgcheck=0 is risky, but we'll keep it excluded for now

# Ideally, this should have no limit
max_parallel_downloads=20

metadata_expire=8h
minrate=1
module_obsoletes=1
retries=8
module_stream_switch=1
multilib_policy="best"
obsoletes=1
plugins=1

# In the case of a kernel change
autocheck_running_kernel=1
protect_running_kernel=1

# Allow anything to be skipped if it is unavailable, w/o halting the operation
skip_if_unavailable=1

# WARNING: releasever="rawhide" is not used, because some repos do not support it, the ones that do support it have it enabled by default
# We'll use the default value for releasever, provided by Bazzite upstream developers

strict=0

# Why would you use this?
throttle=0

timeout=60
upgrade_group_objects_upgrade=1
zchunk=1
