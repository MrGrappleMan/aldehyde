[main]

#### READ THIS ####
# This config file assumes that it is the default for every repo
# Many settings are pre-included here, so don't put duplicate settings in those .repo files
# Valid exceptions you can put in them are:
# gpgcheck=0
# repo_gpgcheck=0
# enabled=0

# Auto-agree
assumeno=0
assumeyes=1
defaultyes=1

# Opportunistic continuity w/o halting operation
best=0
strict=0
allow_downgrade=1
allow_vendor_change=1
skip_if_unavailable=1

# Always use fastest source
fastestmirror=1

# Packages would fail to even run if this check was not present, though FEX translation might be an exception
ignorearch=0

# Weak deps ensure full packages are installed + better potential feature set but huge bloat
# Lets just not remove anything nor add that extra material
clean_requirements_on_remove=1
# Prevents reinstallation of weak deps explicitly asked to be not included before
exclude_from_weak_autodetect=1
install_weak_deps=1

# No bloating the image
keepcache=0
cacheonly=0
build_cache=0
tsflags=nodocs

# Logging
log_compress=1
log_rotate=6
logfilelevel=0
rpmverbosity=warn
color="auto"
debug_solver=0
debuglevel=0

# Verification - transactions, file fetches, protections
gpgcheck=0
repo_gpgcheck=0
diskspacecheck=1
check_config_file_age=1

# No download limits
max_parallel_downloads=20
throttle=0

# Kernel protections disabled
autocheck_running_kernel=1
protect_running_kernel=0

# releasever="rawhide" unused, because some repos do not support it
# Supported ones have it enabled in fstroot/usr/share/factory/etc/yum.repos.d
# We'll use the default value for releasever, provided by Bazzite upstream developers

# Uncategorized
timeout=60
upgrade_group_objects_upgrade=1
zchunk=1
deltarpm=0
metadata_expire=6h
module_obsoletes=1
retries=8
module_stream_switch=1
multilib_policy="best"
obsoletes=1
plugins=1
metadata_expire=6h
module_obsoletes=1
retries=8
module_stream_switch=1
multilib_policy="best"
obsoletes=1
plugins=1
