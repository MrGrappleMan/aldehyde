# This sysctl is made with the intent to be suitable for both HPC and Gaming in mind, maintaining high efficiency
# Using modern algorithms

# (A) means the subsequent options below the comment or that option itself have their values calculated at startup based on,
# system parameters via some formula or condition, or the value is auto-adjusted during runtime.
# Values pre-defined by the kernel developers do not get marked with this.
# This is to let the kernel use adaptive/heuristic based values that are usually better than fixed ones
# Documentation providing the specific information whether something is like this is yet to be explored
# The written options in it are for reference, having no effect.

# '### Doubt ###' means that it is currently being understood

# Sources considered in the creation:
# https://n1kobg.blogspot.com/p/blog-page_23.html?m=1

# ===============================================================================================================
# Filesystem
# ===============================================================================================================
# (A) # fs.file-max = 9223372036854775806
fs.aio-max-nr = 2147483647
fs.inotify.max_user_instances = 2147483647
fs.inotify.max_user_watches = 2147483647

# ================================================================================================================
# ⚙️ Kernel
# ================================================================================================================
# Auto-grouping tasks for improved efficiency, disable for servers
# https://forum.proxmox.com/threads/increase-performance-with-sched_autogroup_enabled-0.41729/ # http://www.youtube.com/watch?v=prxInRdaNfc
kernel.sched_autogroup_enabled = 1
# 1 for intelligent process management
# 0 for Determinism

# Emergency actions - REISUB / Auto recovery
kernel.sysrq = 1
kernel.nmi_watchdog = 1
kernel.soft_watchdog = 1
kernel.watchdog = 1
kernel.oops_limit = 0
kernel.panic_on_oops = 0
kernel.panic_on_stackoverflow = 0

# Allow timers to be moved to active cores for efficiency
kernel.timer_migration = 1

# Throttles any program that causes a split lock but keeps the rest of the system responsive
# Set to 0 when full resource utilization is needed by a single process
kernel.split_lock_mitigate = 0
# 1 to enable the protection method
# 0 to disable it

# Statistics
kernel.sched_schedstats = 0
kernel.task_delayacct = 0

kernel.pid_max = 4194304 # Large number of allocatable processes

# (A) kernel.sched_latency_ns = 4000000 # 4 ms
#kernel.sched_min_granularity_ns = 4000000 # 4 ms
# Lower value allows(not induces a forced request) the kernel to do task load distribution over multiple cores more effectively
# The action of it is done automatically
# Greater parallelization, unpredictable workloads(like gaming) needs and lowering latency
# A tradeoff is task bouncing, causing CPU cache context misses, bad for deterministic HPC
#kernel.sched_migration_cost_ns = 500000 # 0.5 ms

# ================================================================================================================
# 🌐 Networking
# ================================================================================================================

### Doubt ###
# A higher dev_weight can allow the kernel to process more packets in a single pass
# potentially reducing CPU overhead and improving throughput for high-bandwidth applications
# 65536 can starve userspace, cause GUI stuttering
#net.core.dev_weight = 1024
#net.core.netdev_budget = 2048
#net.core.skb_defer_max = 128
#net.core.netdev_max_backlog = 2048 # 2147483647
#net.ipv4.tcp_max_syn_backlog = 2147483647
# Automatic prevents OOM errors and excess starvation
# A single idle TCP socket can still grow huge if some buggy app or peer triggers the auto-tuning logic
# Setting minimums to 1 makes the system less stable under memory pressure, not more. I thought it was more efficent at first
# It prevents the TCP stack from giving memory back when the system really needs it, so you get zombie connections, GUI freezes, or full OOM killer storms instead of graceful degradation.
#net.ipv4.tcp_max_tw_buckets = 2000000 # A

# Explicit Congestion Notification, helps avoid packet loss on modern routers.
net.ipv4.tcp_ecn = 1

# Convert BPF bytecode to native code for faster execution
net.core.bpf_jit_enable = 1
# 1 for normal, 2 for debug

net.core.bpf_jit_harden = 0 # Hardening costs performance, disable on trusted device
net.ipv4.addr_gen_mode = 0
net.ipv4.tcp_shrink_window = 1
net.ipv4.tcp_window_scaling = 1 # allow TCP window size to exceed the original 65,535-byte limit
net.ipv4.tcp_syncookies = 1 # Protects against attacks
net.ipv4.tcp_tw_reuse = 1 # Allow fast socket reuse
net.ipv4.accept_ra = 2

# Keep equal for balanced packet communication
net.core.dev_weight_tx_bias = 1
net.core.dev_weight_rx_bias = 1

# Ideally, the limit should be auto limited if stability/packet loss issues occur, else scale higher
net.core.somaxconn = 8192 # 2147483647 is max

# AutoConfig IPv4 interfaces
net.ipv4.autoconf = 1

# No support for BBR2 yet
net.ipv4.tcp_congestion_control = bbr

# BBR is designed with FQ in mind and best paired with it
# BBR pacing is more accurate with 'fq' than 'fq_codel'
net.core.default_qdisc = fq

# Sends data in a full TX packet for efficiency
net.ipv4.tcp_autocorking = 1
# 1 for data throughput, saving bandwidth, efficiency - CDNs/Datacenters
# 0 for low latency - Gaming/Desktop/Interactive tasks

# Auto change source IP address of packets and sockets during retransmissions
net.ipv4.ip_dynaddr = 1

# Allow clients to send data in the initial SYN packet
# Reduce TCP initialization latency
net.ipv4.tcp_fastopen = 3

# Lower latency prioritized over maximum throughput, this option is old, still kept and has some effect
net.ipv4.tcp_low_latency = 1
# 1 = latency sensitive cases or gaming, some optimizations are disabled
# 0 = normal packet transmittion with optimizations and efficiency

# MTU Probing checks
net.ipv4.tcp_mtu_probing = 1
# 1 = MTU is probed if ICMP Black holes are detected
# 2 = Forces probing, inefficient, only on unstable connecttions

# Optimized processing
net.ipv4.udp_early_demux = 1

# Dynamically picks an ideal receive buffer between your min and max based on measured BDP (bandwidth-delay product) and application read rate
net.ipv4.tcp_moderate_rcvbuf = 1

# (A) Dependant on system RAM, values calculated
# using the values below will lead to OOMs and system instability
#net.core.optmem_max = 2147483647
#net.core.rmem_default = 262144
#net.core.rmem_max = 2147483647
#net.core.wmem_default = 262144
#net.core.wmem_max = 2147483647
#net.ipv4.tcp_mem = 1 262144 2147483647
#net.ipv4.tcp_rmem = 1 262144 2147483647
#net.ipv4.tcp_wmem = 1 262144 2147483647
#net.ipv4.udp_mem = 1 262144 2147483647
#net.ipv4.udp_rmem_min = 1
#net.ipv4.udp_wmem_min = 1

# ======================================================================================================================================================
# 🎬 Virtual Memory - unused physical RAM is wasted RAM, prioritize RAM over frequent swapping
# ======================================================================================================================================================

# Triggers, value changes triggers actions, and this is not an editable option type
#vm.compact_memory = 1
#vm.drop_caches = 1

vm.compact_unevictable_allowed = 1

# Do compaction beforehand, but very less
##vm.compaction_proactiveness = 1

vm.enable_soft_online = 1
##vm.extfrag_threshold = 100 # Reduce memory compaction impacts
vm.max_map_count = 2147483647 # Required for large processes
vm.highmem_is_dirtyable = 1

# Statistics
# Strictly for User-space monitoring and some non-critical background heuristics.
# No effect on kernel VM manager
vm.numa_stat = 0
vm.stat_interval = 30

# Out of Memory, Recovery
vm.oom_kill_allocating_task = 0 # Kill highest memory consumer instead of just what caused the OOM upon spawning, slow but accurate
vm.oom_dump_tasks = 1 # Help diagnose OOM issues
vm.memory_failure_recovery = 1 # Recover memory on failure
vm.panic_on_oom = 0 # Never let OOM make the entire kernel panic and halt

# Page lock unfairness - balanced
#vm.page_lock_unfairness = 5

# Use transparent huge pages, normal huge pages waste space and arent adaptive
vm.nr_hugepages = 0

# Trim excess pages and return them to the allocator
vm.nr_trim_pages = 1

vm.hugetlb_optimize_vmemmap = 1

# Overcommiting of memory
vm.overcommit_memory = 0
# 1 allows large allocations blindly so lower overhead, but more OOM risk
# 0 large allocations done if request seems suitable, by metrics
# 2 no large allocations

vm.page-cluster = 0 # minimizes latency, for ZSwap hot cache

# Memory swapping ( behaviour is very different with ZSwap active )
# In practice, swap is a backup resort if memory is over-used and prevents OOM errors
# Low values = kernel avoids swapping/compressing data until OOM, thus massive stall when the
# kernel finally panics to find memory, so ZSwap in this case is useless
# High values allow action to be done preemptively + ZSwap is more effective and efficiently works
# as high values on traditional swap cause high disk usage and slowdowns
vm.swappiness = 180

# Laptop Mode — disable for lower I/O latency, ensure data integrity
# This feature is risky on desktops for reasons like sudden power cuts, plug being accidentally removed
# It reschedules IO operation to be done in batches after longer timespans
# Is auto managed by TuneD
vm.laptop_mode = 0

#vm.vfs_cache_pressure = 50 # Retain caches longer - faster IO, lower overhead
vm.zone_reclaim_mode = 0 # Can stalls under memory pressure on NUMA systems, modern kernel handles reclaim better globally
#vm.watermark_boost_factor = 250 # minimal headroom for mem reclamation
#vm.watermark_scale_factor = 150 # Make kswapd reclaim memory early (1.5% of RAM)

vm.dirty_ratio = 25
# Allow 25% of RAM to be used to reschedule pending writes to disk, as a headroom. Dont increase much, to allow actual programs in need to use that memory
# It is better to just ask the system to write the data than letting it cope with it pending 
vm.dirty_background_ratio = 1 # Start background write activity immediately for smoothness
vm.dirty_expire_centisecs = 3000 # Data sits in RAM for 30 secs before being considered "old"
vm.dirty_writeback_centisecs = 500 # Wake up every 5s to check, but dirty_ratio governs the action
vm.min_free_kbytes = 65536
