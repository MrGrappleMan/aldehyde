### TuneD main config file ###

# Daemon for full integration and capabilites
daemon = 1

# Dynamic device tuning, can cause system overhead and stutters
dynamic_tuning = 0

# Event check granularity in seconds VS overhead
sleep_interval = 2

# Update interval in seconds, must be a multiple of sleep_interval. This is for dynamic tuning
update_interval = 20

# To parse and use recommend.conf
recommend_command = 1

# Maintain sysctl config files option effectiveness
# TuneD sysctls will not override user enforced sysctl parameters
reapply_sysctl = 1

# Default priority assigned to instances
default_instance_priority = 0

# Udev buffer size, high for better readings and monitoring
udev_buffer_size = 16MB

# Logging
log_file_count = 2
log_file_max_size = 4MB

# Preset system uname string for architecture specific tuning.
# It can be used to force tuning for specific architecture.
# If commented, "uname" will be called to fill its content.
# uname_string = x86_64

# Preset system cpuinfo string for architecture specific tuning.
# It can be used to force tuning for specific architecture.
# If commented, "/proc/cpuinfo" will be read to fill its content.
# cpuinfo_string = Intel

# Listen on dbus
enable_dbus = 1

# Enable TuneD listening on unix domain socket
# As this functionality is not used commonly, we disable it by default
# and it is needed to allow it manually
# enable_unix_socket = 0
# Path to socket for TuneD to listen
# Existing files on given path will be removed
# unix_socket_path = /run/tuned/tuned.sock
# Paths to sockets for TuneD to send signals to separated by a comma or a semicolon
# unix_socket_signal_paths =
# Default unix socket ownership
# Can be set as id or name, -1 or non-existing name leaves unchanged
# unix_socket_ownership = -1 -1
# Permissions for listening sockets
# unix_socket_permissions = 0o600

# Size of connections backlog for listen function on socket
# Higher value allows to process requests from more clients
#connections_backlog = 1024

# TuneD daemon rollback strategy on process exit - rollbacks always done on profile switch
# - auto: Do rollbacks on TuneD process exit
# - not_on_exit: No rollbacks on TuneD process exit
rollback = auto

# Directories to search for profiles, separate by commas or semicolons
# In case of conflicts in profile names, the next directory takes precedence
# Only /usr/ directory to ensure no misconfiguration
profile_dirs = /usr/lib/tuned/profiles

# Timeout in seconds to wait until udev settles. Value 0 disables the wait.
# With non-zero wait TuneD startup is delayed until there are no pending
# udev events or the specified timeout occurs.
# The delay can help in situations where there are a lot of udev events
# during TuneD startup and TuneD is too slow to handle them.
# In environments where systemd is utilised for starting TuneD
# it is better to keep this feature disabled and rely on systemd
# functionality (systemd-udev-settle).
startup_udev_settle_wait = 0
