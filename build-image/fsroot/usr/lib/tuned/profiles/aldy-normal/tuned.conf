[main]
summary = Aldehyde power profile: Normal - for efficiency for everyday work
# Independant of other profiles - serve as a base

[cpu]
# Being energy efficiency biased gives long term energy savings
# prevents thermal throttling later, CPU seeks to do tasks more efficiently
energy_perf_bias = balance_power
energy_performance_preference = balance_power
# Remove unconditional boost - let EPP+amd_pstate govern it instead
boost = 0

[audio]
# Let the audio controller sleep
timeout=5

[sysctl]
vm.swappiness = 165
# Restore your watermark values - Bazzite sets watermark_boost_factor=0
# which disables the boost zone entirely, causing more aggressive kswapd storms
vm.watermark_boost_factor = 250
vm.watermark_scale_factor = 150
vm.dirty_ratio = 25
vm.dirty_background_ratio = 1

[sysfs]
# Do NOT force cpb_boost=enabled - leave boost gated to EPP
/sys/devices/system/cpu/amd_pstate/cpb_boost = disabled
```

**`usr/lib/tuned/profile_mode`**
```
aldehyde
