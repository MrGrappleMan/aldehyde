[main]
summary = aldy-ac: For AC power supply. Optimized for device lifespan.
# Assumes Pstate support is present

[acpi]
platform_profile=balanced

[audio]
# Audio controller sleeps in 10s
timeout = 10

[cpu]
# Enforce energy efficiency, reduce thermal throttling
energy_perf_bias = balance_power
energy_performance_preference = balance_power
governor = powersave
boost = 1

[sysctl]
# Aggressive zswap settings
vm.swappiness = 180
vm.watermark_boost_factor = 250
vm.watermark_scale_factor = 150
vm.dirty_ratio = 25
vm.dirty_background_ratio = 1

[scsi_host]
alpm=med_power_with_dipm

[video]
panel_power_savings=1
radeon_powersave=dpm-balanced, auto

#script=${i:PROFILE_DIR}/script.sh
