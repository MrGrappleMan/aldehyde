[Login]
  
# --- Core philosophy ---
# Avoid complete off at all costs
# Keep everything on at a low power state via suspension when not needed by user
# Hibernate ONLY when battery is critically low to prevent disk wear
# Behaviour dependent on user interaction
# User ideally should not override device power policy but we will allow it based on the request

# Lid behavior
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore

# Button behaviour
HandlePowerKey=suspend
HandleRebootKey=reboot
HandleSuspendKey=suspend

# --- Battery safety net ---
# Hibernate ONLY on critical battery
HandleBatteryLow=ignore
HandleBatteryCritical=hibernate

# --- Session hygiene ---
# This conflicts with what you set in your desktop
# so idle is dependent on what you set in userspace, the supension, the screen timeout
KillUserProcesses=no
IdleAction=ignore
IdleActionSec=0
