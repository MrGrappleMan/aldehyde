[zram0]

# Allow maximum fitting of volatile data in RAM, you can increase it with a multiplier if want to do so.
# This ensures maximum packing without hitting the kernel's tracking overhead limits.
zram-size = ram

# Keeps the zram device entirely in memory without artificial constraints.
zram-resident-limit = 0
host-memory-limit = none

# Greater amount of data per physical RAM capacity, CPUs are efficient at it
compression-algorithm = zstd

# Largest swap priority over anything else
swap-priority = 32766

options = async discard exec noatime nodiratime nosuid
