[zram0]

# Best balance between compression and memory usage
zram-size = ram / 2

zram-resident-limit = 0
host-memory-limit = none

# Better for sustained desktop speed vs ZSTD
compression-algorithm = lz4

# Physical swap device to use for writeback
# writeback-device = /dev/nvme0n1p3

# Largest possible swap priority
swap-priority = 32766

options = async discard exec noatime nodiratime nosuid
