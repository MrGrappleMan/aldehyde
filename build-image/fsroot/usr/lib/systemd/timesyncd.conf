[Time]

# Telemetric - Left to right by distros
# This lets distro maintainers know how may devices in total use that distro via a rough estimate
NTP=fedora.pool.ntp.org rhel.pool.ntp.org ubuntu.pool.ntp.org debian.pool.ntp.org

# General - Left to right by accuracy
# A fallback set of servers that just purely provide the time syncing functionality
NTP=time.google.com time.windows.com time.cloudflare.com pool.ntp.org time.facebook.com time.nist.gov time.apple.com time.aws.com timekeeper.isi.edu ntp.ripe.net

# Adapts to the hardware clock over time for balanced efficiency and accuracy
PollIntervalMinSec=17
PollIntervalMaxSec=86400

# Try connecting every 20 secs if a request fails
ConnectionRetrySec=20

# Ensure time accuracy is not lost over server request contact distance
RootDistanceMaxSec=6

# 90 seconds of save interval, even if a larger time might seem suitable, mission critical cases need accuracy
# Write lifespan to disk is negligible
SaveIntervalSec=90
