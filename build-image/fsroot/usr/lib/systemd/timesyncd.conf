[Time]

# General - By accuracy/reliability/uptime factor
# First is best, last is worst
# Placed over telemetric, as this factor is more important
NTP=time.cloudflare.com time.google.com pool.ntp.org time.aws.com ntp.ripe.net time.nist.gov time.apple.com time.windows.com time.facebook.com timekeeper.isi.edu

# Telemetric - Left to right by distro bias
# Statistically track number of devices which use that distro
NTP=fedora.pool.ntp.org rhel.pool.ntp.org ubuntu.pool.ntp.org debian.pool.ntp.org

# Adapts to the hardware clock over time for balanced efficiency and accuracy
PollIntervalMinSec=17
PollIntervalMaxSec=86400

# Reconnect every 20s if a request fails
ConnectionRetrySec=20

# Ensure time accuracy is not lost over server request contact distance
RootDistanceMaxSec=6

# 60 seconds of save interval, even if a larger time might seem suitable, mission critical cases need accuracy
# Disk lifespan impact is negligible
SaveIntervalSec=60
