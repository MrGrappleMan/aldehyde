### =======================================================================
###  📑 Resolution settings
### =======================================================================

### 🤯 By adding DNS=127.0.0.1:53 OR 127.0.0.53
### You end up sending queries to resolved or the glibc resolver → which uses your upstreams → recursion loop risk
### Systemd will ignore it or result in abnormal behavior. 127.0.0.53 ITSELF IS the address where systemd-resolved listens for local clients
### Local handling automatically done by systemd-resolved

# Caching
CacheFromLocalhost=1
Cache=1
DNSStubListener=1

# 🔒 Security - prevent request manipulation and malforming
# DoQ or HTTPS/3 support in systemd-resolved = better performance, security, standards
# Despite the speed you may get from disabling the options, validation is important
DNSSEC=allow-downgrade
DNSOverTLS=opportunistic
#DNSSEC=0
#DNSOverTLS=0

# 🪝 Allow local device discovery of IoT, printers, servers, etc.
MulticastDNS=1

# LLMNR - is a security risk
LLMNR=0

# 🔖 Enable to allow local exception list functionality, hBlock as well
# Minimal impact on resolution time
# https://forum.endeavouros.com/t/will-large-hosts-file-impact-performance/26976/8
ReadEtcHosts=1
