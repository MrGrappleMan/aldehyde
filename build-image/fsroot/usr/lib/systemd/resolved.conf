[Resolve]
# resolved.conf(5)
### Graded as per speed, uptime, reliability and reputation
### See 'https://dnsspeedtest.online/' for your device
### Systemd-resolved does not do DNS requests in parallel to DNS servers
### A fallback is worth keeping only if its overhead does not severely impact the main operation

### =======================================================================
###  📑 Servers
### =======================================================================

### 1. 🛑 Ad blocking
### For fast surfing and less distractions
### Less stress on locally run solutions, filter lists managed universally and auto-updated
### For guaranteed blocking, use both
### Enhances privacy, but may reduce personalization and honest and ethical telemetry

# AdGuard DNS
DNS=2a10:50c0::ad1:ff#dns.adguard-dns.com 2a10:50c0::ad2:ff#dns.adguard-dns.com 94.140.14.14#dns.adguard-dns.com 94.140.15.15#dns.adguard-dns.com
# Control-D
DNS=2606:1a40::2#p2.freedns.controld.com 2606:1a40:1::2#p2.freedns.controld.com 76.76.2.2#p2.freedns.controld.com 76.76.10.2#p2.freedns.controld.com
# LibreDNS + NoAds
DNS=2a01:4f8:1c0c:8274::1#noads.libredns.gr 116.202.176.26#noads.libredns.gr

### 2. 🛡️ Security protection
### Block malicious software/websites

# Google
DNS=2001:4860:4860::8888#dns.google 2001:4860:4860::8844#dns.google 8.8.8.8#dns.google 8.8.4.4#dns.google
# Cloudflare - Malware Blocking
DNS=2606:4700:4700::1112#security.cloudflare-dns.com 2606:4700:4700::1002#security.cloudflare-dns.com 1.1.1.2#security.cloudflare-dns.com 1.0.0.2#security.cloudflare-dns.com
# Quad9 ECS validation - Geographically specialized, personalized, load distribution, fast
DNS=2620:fe::11#dns11.quad9.net 2620:fe::fe:11#dns11.quad9.net 9.9.9.11#dns11.quad9.net 149.112.112.11#dns11.quad9.net

### 3. 👁️ Uncensored/Privacy

# Cloudflare - Privacy
DNS=2606:4700:4700::1111#one.one.one.one 2606:4700:4700::1001#one.one.one.one 1.1.1.1#one.one.one.one 1.0.0.1#one.one.one.one
# Quad9 - Privacy
DNS=2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net 9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
# UncensoredDNS Anycast
DNS=91.239.100.100#anycast.uncensoreddns.org 2001:67c:28a4::#anycast.uncensoreddns.org
# UncensoredDNS Unicast
DNS=89.233.43.71#unicast.uncensoreddns.org 2a01:3a0:53:53::#unicast.uncensoreddns.org
# DNS.Watch
DNS=2001:1608:10:25::1c04:b12f#resolver1.dns.watch 2001:1608:10:25::9249:d69b#resolver2.dns.watch 84.200.69.80#resolver1.dns.watch 84.200.70.40#resolver2.dns.watch

