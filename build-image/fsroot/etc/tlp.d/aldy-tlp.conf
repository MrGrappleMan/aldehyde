# https://linuxblog.io/boost-battery-life-on-linux-laptop-tlp/

# Enable TLP
TLP_ENABLE=1

# Let defaults act as a fallback
TLP_DISABLE_DEFAULTS=0

# Report to syslog/journal and stderr
TLP_WARN_LEVEL=3

# Warn level colors
TLP_MSG_COLORS="91 93 97 92"

# Auto switch to BAL/SAV mode based on power source
# Do not let user override
TLP_AUTO_SWITCH=1

# Per source mode
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=BAL

# Default mode to assume
TLP_DEFAULT_MODE=BAL

# Let source specific settings work
TLP_PERSISTENT_DEFAULT=0

# A higher value is better on non PulseAudio systems
# BAT assumes you are not gaming or wont hear the random pop sounds, so saves power
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=4

# Allow DSP controller power saving
SOUND_POWER_SAVE_CONTROLLER=Y

# Maintain battery thresholds
RESTORE_THRESHOLDS_ON_BAT=1

NATACPI_ENABLE=1 # Battery care drivers
TPSMAPI_ENABLE=1 # The above, but for ThinkPads

DISK_APM_LEVEL_ON_AC="254 254" # No APM, longer lifespan of R/W heads
DISK_APM_LEVEL_ON_BAT="216 216" # Suitable operation

DISK_SPINDOWN_TIMEOUT_ON_AC="0 0" # Never spin-down, longer lifespan of spindle motor
DISK_SPINDOWN_TIMEOUT_ON_BAT="240 240" # Spin-down after 20 min idle

DISK_IOSCHED="kyber kyber"
# kyber - SSDs, highly efficient and modern
# mq-deadline - HDDs
# none - not recommended, even though technically fastest, it is impractical

# Intelligent operation of AHCI link power management
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="med_power_with_dipm"

# Power down idle devices
AHCI_RUNTIME_PM_ON_AC=auto
AHCI_RUNTIME_PM_ON_BAT=auto

# Time before idle devices are powered down
AHCI_RUNTIME_PM_TIMEOUT=10

# Do not change
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# Writing unsaved data in file system buffers to disk.
MAX_LOST_WORK_SECS_ON_AC=30
MAX_LOST_WORK_SECS_ON_BAT=75

INTEL_GPU_POWER_PROFILE_ON_AC=base
INTEL_GPU_POWER_PROFILE_ON_BAT=base
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# Automatic DPM
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=auto

# ABM gives power savings and lower burn-in
# Mainly for laptops
AMDGPU_ABM_LEVEL_ON_AC=4
AMDGPU_ABM_LEVEL_ON_BAT=4

NMI_WATCHDOG=0 # No watchdog overhead

WIFI_PWR_ON_AC=off # Power saving mode can cause unstable Wi-Fi
WIFI_PWR_ON_BAT=on

# Follow BIOS defaults for WOL
WOL_DISABLE=N

# Balanced power profile
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=deep
# s2idle for background data sync, faster wakes
# deep results in lower power consumption, only DRAM refresh
# FACT: Apple implemented an efficient, low-power "modern standby" equivalent long before most regular PCs

# Active lets the HW decide the best power mode without OS restriction
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active

# powersave is not a true governor for pstate in active mode
# But lets sensible EPPs to take advantage of it
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# Both balance_power and balance_performance let the device use max performance when needed
# They are mainly biases
CPU_ENERGY_PERF_POLICY_ON_AC=balance_power
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100 # Race to idle

# Critical situation
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=35

# Allow turbo boost when needed
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0 # Critical

# Intel CPU HWP dynamic boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1

DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth wifi wwan" # Disable these if not in use if switching to battery

# Only condition based
DEVICES_TO_ENABLE_ON_STARTUP=""
DEVICES_TO_DISABLE_ON_STARTUP=""

DEVICES_TO_ENABLE_ON_AC="bluetooth wifi wwan"

# Conditional switching of devices
DEVICES_TO_DISABLE_ON_LAN_CONNECT="wifi wwan"
DEVICES_TO_DISABLE_ON_WIFI_CONNECT="wwan"
DEVICES_TO_DISABLE_ON_WWAN_CONNECT="wifi"
DEVICES_TO_ENABLE_ON_LAN_DISCONNECT="wifi wwan"
DEVICES_TO_ENABLE_ON_WIFI_DISCONNECT="wwan"
DEVICES_TO_ENABLE_ON_WWAN_DISCONNECT="wifi"

# Power down idle devices
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default

USB_AUTOSUSPEND=1 # Allow auto-power off of peripherals
#USB_EXCLUDE_BTUSB=0
#USB_EXCLUDE_AUDIO=0
#USB_EXCLUDE_PHONE=0
#USB_EXCLUDE_PRINTER=0
#USB_EXCLUDE_WWAN=0
